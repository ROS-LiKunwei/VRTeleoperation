sysmo_left_group_controller:
  ros__parameters:
    joints:
      - left_arm_joint1
      - left_arm_joint2
      - left_arm_joint3
      - left_arm_joint4
      - left_arm_joint5
      - left_arm_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity