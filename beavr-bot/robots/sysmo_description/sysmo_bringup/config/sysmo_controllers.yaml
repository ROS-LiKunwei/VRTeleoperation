controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    effort_controller:
      type: effort_controllers/JointGroupEffortController

    sysmo_left_group_controller:     
       type: joint_trajectory_controller/JointTrajectoryController

effort_controller:
  ros__parameters:
  
    joints:
      - waist_joint1
      - waist_joint2
      - left_leg_joint1
      - left_leg_joint2
      - left_leg_joint3
      - left_leg_joint4
      - left_leg_joint5
      - left_leg_joint6
      - right_leg_joint1
      - right_leg_joint2
      - right_leg_joint3
      - right_leg_joint4
      - right_leg_joint5
      - right_leg_joint6
      - left_arm_joint1
      - left_arm_joint2
      - left_arm_joint3
      - left_arm_joint4
      - left_arm_joint5
      - left_arm_joint6
      - right_arm_joint1
      - right_arm_joint2
      - right_arm_joint3
      - right_arm_joint4
      - right_arm_joint5
      - right_arm_joint6

    command_topic: /effort_controller/commands
    interface_name: effort

    command_interfaces: effort

    state_interfaces:
      - position
      - effort

